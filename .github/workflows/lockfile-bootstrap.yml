name: Bootstrap desktop dependency lockfile

on:
  push:
    branches:
      - "feat/browser-foundation"

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !hashFiles('desktop/package-lock.json') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reproducible npm lockfile
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "build: lock desktop dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
