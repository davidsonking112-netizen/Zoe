name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Check desktop JavaScript
        working-directory: desktop
        run: npm run check:js
      - name: Test desktop security helpers
        working-directory: desktop
        run: npm test
      - name: Smoke-test Electron browser and AI-safe page inspection
        working-directory: desktop
        run: timeout 90s xvfb-run -a env ZOE_SMOKE_TEST=1 npm start
      - name: Smoke-test the actual Electron browser
        working-directory: desktop
        env:
          ZOE_SMOKE_TEST: "1"
        run: xvfb-run -a npm run smoke
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run lint
        run: ruff check .
      - name: Install Firefox for Playwright
        run: python -m playwright install --with-deps firefox
      - name: Run tests
        run: pytest --cov=zoe --cov-report=term-missing
